name: Actualizar datos del tablero

on:
  schedule:
    # 08:00, 13:00 y 18:00 hora de Quito (UTC-5)
    - cron: "0 14 * * *"
    - cron: "0 18 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install pandas requests

      - name: Ejecutar extracción y generar JSON
        env:
          MOTORIA_ACCESS_TOKEN: ${{ secrets.MOTORIA_ACCESS_TOKEN }}
          JETOUR_ACCESS_TOKEN: ${{ secrets.JETOUR_ACCESS_TOKEN }}
        run: python actualizar_tablero.py

      - name: Guardar cambios en el repositorio si hubo actualización
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tablero_leads_motoria_jetour.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: actualizar tablero_leads_motoria_jetour.json"
            git push
          else
            echo "Sin cambios en el JSON."
          fi
